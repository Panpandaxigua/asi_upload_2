[project]
name = "asi-product-upload"
version = "1.0.0"
description = "ASI 产品自动上传工具"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6,<6.9",
    "pandas>=2.1,<3",
    "openpyxl>=3.1,<4",
    "DrissionPage>=4.0,<5",
    "loguru>=0.7,<1",
    "cryptography>=42,<44",
    "wmi>=1.5,<2 ; sys_platform == 'win32'",
    "pywin32>=306 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
build = [
    "pyinstaller>=6.20.0",
]
dev = [
    "pyinstaller>=6.20.0",
]
